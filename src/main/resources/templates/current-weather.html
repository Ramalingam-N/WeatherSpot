<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Current Weather | WeatherSpot</title>
		
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
		<link rel="icon" th:href="@{/img/weatherSpot1.png}" type="image/png" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
		<link rel="stylesheet" th:href="@{/style/current-weather-style.css}" />
	</head>
	<body>
		<div class="container">
			<nav>
				<a th:href="@{/}" class="brand">
					<img class="app-name" th:src="@{/img/weatherSpot1.png}" alt="WeatherSpot Logo" />
					<h1 class="app-name">WeatherSpot</h1>
				</a>
				<div class="nav-links">
					<a class="nav-link" th:href="@{/historical-weather(location=${location}, date=${date})}">History</a>
					<a class="nav-link" th:href="@{/daily-weather(location=${location})}">Daily</a>
					<a class="nav-link" th:href="@{/hourly-weather(location=${location})}">Hourly</a>
					<a class="nav-link" th:href="@{/current-weather(location=${location})}">Current</a>
				</div>
			</nav>

			<main class="main-content">
				<form method="GET" th:action="@{/current-weather}" class="search-form">
					<div class="search-wrapper">
						<input class="place" type="search" name="location" placeholder="Search a city for instant weather..." required />
						<button type="submit" class="search-btn">Search</button>
					</div>
				</form>

				<div class="weather-dashboard">
					<div data-aos="fade-up" data-aos-duration="1000" class="glass-card main-temp-card">
						<div class="location-header">
							<h2 th:text="${weather.name}">City Name</h2>
							<p th:text="${weather.address}">Region, Country</p>
						</div>
						
						<div class="temp-display">
							<img th:src="@{'/img/' + ${weather.currentConditions.icon} + '.png'}" alt="Weather Icon" class="weather-icon" />
							<div class="temp-value">
								<span th:text="${weather.currentConditions.temp}" class="temp"></span>
								<span class="degree">&deg;C</span>
							</div>
						</div>
						
						<div class="condition-text">
							<span th:text="${weather.currentConditions.conditions}">Condition</span>
						</div>
					</div>

					<div class="secondary-stats">
						<div data-aos="fade-up" data-aos-delay="100" data-aos-duration="1000" class="glass-card stat-card">
							<div class="stat-row">
								<img th:src="@{/img/temperature.png}" alt="Feel Like" />
								<span>Feels Like</span>
								<strong th:text="${weather.currentConditions.feelslike} + '&deg;C'"></strong>
							</div>
							<div class="stat-row">
								<img th:src="@{/img/up.png}" alt="Max Temp" />
								<span>Max Temp</span>
								<strong th:text="${weather.days.get(0).tempmax} + '&deg;C'"></strong>
							</div>
							<div class="stat-row">
								<img th:src="@{/img/down.png}" alt="Min Temp" />
								<span>Min Temp</span>
								<strong th:text="${weather.days.get(0).tempmin} + '&deg;C'"></strong>
							</div>
						</div>

						<div data-aos="fade-up" data-aos-delay="200" data-aos-duration="1000" class="glass-card stat-card grid-2-col">
							<div class="stat-item">
								<img th:src="@{/img/sunrise.png}" alt="Sunrise" />
								<span>Sunrise</span>
								<strong th:text="${weather.currentConditions.sunrise}"></strong>
							</div>
							<div class="stat-item">
								<img th:src="@{/img/sunset.png}" alt="Sunset" />
								<span>Sunset</span>
								<strong th:text="${weather.currentConditions.sunset}"></strong>
							</div>
							<div class="stat-item">
								<img th:src="@{/img/wind.png}" alt="Wind" />
								<span>Wind</span>
								<strong><span th:text="${weather.currentConditions.direction}"></span> <span th:text="${weather.currentConditions.windspeed}"></span> km/h</strong>
							</div>
							<div class="stat-item">
								<img th:src="@{/img/wind1.png}" alt="Gusts" />
								<span>Gusts</span>
								<strong th:text="${weather.days.get(0).windgust} + ' km/h'"></strong>
							</div>
							<div class="stat-item">
								<img th:src="@{/img/humidity2.png}" alt="Humidity" />
								<span>Humidity</span>
								<strong th:text="${weather.currentConditions.humidity} + '%'"></strong>
							</div>
							<div class="stat-item">
								<img th:src="@{/img/dew2.png}" alt="Dew" />
								<span>Dew Point</span>
								<strong th:text="${weather.currentConditions.dew} + '&deg;C'"></strong>
							</div>
							<div class="stat-item">
								<img th:src="@{/img/cloud.png}" alt="Cloud Cover" />
								<span>Clouds</span>
								<strong th:text="${weather.currentConditions.cloudcover} + '%'"></strong>
							</div>
							<div class="stat-item">
								<img th:src="@{/img/uv-index.png}" alt="UV" />
								<span>UV Index</span>
								<strong th:text="${weather.currentConditions.uvindex}"></strong>
							</div>
						</div>
					</div>
				</div>
			</main>
		</div>
		
		<div class="spinner"></div>
		
		<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
		<script th:src="@{/js/current-historical.js}"></script>
	</body>
</html>
