<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Daily Forecast | WeatherSpot</title>
		
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
		<link rel="icon" th:href="@{/img/weatherSpot1.png}" type="image/png" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
		<link rel="stylesheet" th:href="@{/style/daily-weather-style.css}" />
	</head>
	<body>
		<div class="container">
			<nav>
				<a th:href="@{/}" class="brand">
					<img class="app-name" th:src="@{/img/weatherSpot1.png}" alt="WeatherSpot Logo" />
					<h1 class="app-name">WeatherSpot</h1>
				</a>
				<div class="nav-links">
					<a class="nav-link" th:href="@{/historical-weather(location=${location}, date=${date})}">History</a>
					<a class="nav-link" th:href="@{/daily-weather(location=${location})}">Daily</a>
					<a class="nav-link" th:href="@{/hourly-weather(location=${location})}">Hourly</a>
					<a class="nav-link" th:href="@{/current-weather(location=${location})}">Current</a>
				</div>
			</nav>

			<main class="main-content">
				<form method="GET" th:action="@{/daily-weather}" class="search-form">
					<div class="search-wrapper">
						<input class="place" type="search" name="location" placeholder="Search a city for daily forecast..." required />
						<button type="submit" class="search-btn">Search</button>
					</div>
				</form>

				<div class="location-header" data-aos="fade-down" data-aos-duration="800">
					<h1 th:text="${weather.name}">City Name</h1>
					<p th:text="${weather.address}">Region, Country</p>
				</div>

				<div class="daily-dashboard">
					<div class="glass-card daily-card" data-aos="fade-up" data-aos-duration="600" th:each="forecast : ${weather.days}">
						
						<div class="card-date-info">
							<div class="date-block">
								<span class="day-text" th:text="${forecast.day}"></span>
								<span class="date-text" th:text="${forecast.formattedDate}"></span>
							</div>
							<div class="condition-block">
								<span th:text="${forecast.conditions}"></span>
							</div>
						</div>

						<div class="card-temp-info">
							<img th:src="@{'/img/' + ${forecast.icon} + '.png'}" alt="Weather Icon" class="weather-icon" />
							<div class="temp-display">
								<h3 th:text="${forecast.temp}"></h3>
								<span class="degree">&deg;C</span>
							</div>
							<div class="min-max-block">
								<div class="max">
									<img src="/img/up.png" alt="Max" />
									<span th:text="${forecast.tempmax} + '&deg;C'"></span>
								</div>
								<div class="min">
									<img src="/img/down.png" alt="Min" />
									<span th:text="${forecast.tempmin} + '&deg;C'"></span>
								</div>
							</div>
						</div>

						<div class="card-divider"></div>

						<div class="card-stats-grid">
							<div class="stat-item feels-like">
								<img src="/img/temperature.png" alt="Feels Like" />
								<span>Feel Like: </span>
								<strong th:text="${forecast.feelslike} + '&deg;C'"></strong>
							</div>
							<div class="stat-item">
								<img src="/img/wind.png" alt="Wind" />
								<span>Wind: </span>
								<strong><span th:text="${forecast.direction}"></span> <span th:text="${forecast.windspeed}"></span> km/h</strong>
							</div>
							<div class="stat-item">
								<img src="/img/wind1.png" alt="Gusts" />
								<span>Gusts: </span>
								<strong th:text="${forecast.windgust} + ' km/h'"></strong>
							</div>
							<div class="stat-item">
								<img src="/img/cloud.png" alt="Clouds" />
								<span>Clouds: </span>
								<strong th:text="${forecast.cloudcover} + '%'"></strong>
							</div>
							<div class="stat-item">
								<img src="/img/humidity2.png" alt="Humidity" />
								<span>Humidity: </span>
								<strong th:text="${forecast.humidity} + '%'"></strong>
							</div>
						</div>
						
					</div>
				</div>
			</main>
		</div>
		
		<div class="spinner"></div>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
		<script th:src="@{/js/app.js}"></script>
	</body>
</html>
