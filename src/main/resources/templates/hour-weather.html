<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Hourly Forecast | WeatherSpot</title>
		
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
		<link rel="icon" th:href="@{/img/weatherSpot1.png}" type="image/png" />
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
		<link rel="stylesheet" th:href="@{/style/hour-weather-style.css}" />
	</head>
	<body>
		<div class="container">
			<nav>
				<a th:href="@{/}" class="brand">
					<img class="app-name" th:src="@{/img/weatherSpot1.png}" alt="WeatherSpot Logo" />
					<h1 class="app-name">WeatherSpot</h1>
				</a>
				<div class="nav-links">
					<a class="nav-link" th:href="@{/historical-weather(location=${location}, date=${date})}">History</a>
					<a class="nav-link" th:href="@{/daily-weather(location=${location})}">Daily</a>
					<a class="nav-link" th:href="@{/hourly-weather(location=${location})}">Hourly</a>
					<a class="nav-link" th:href="@{/current-weather(location=${location})}">Current</a>
				</div>
			</nav>

			<main class="main-content">
				<form method="GET" th:action="@{/hourly-weather}" class="search-form">
					<div class="search-wrapper">
						<input class="place" type="search" name="location" placeholder="Search a city for hourly forecast..." required />
						<button type="submit" class="search-btn">Search</button>
					</div>
				</form>

				<div class="location-header" data-aos="fade-down" data-aos-duration="800">
					<h1 th:text="${weather.get(0).name}">City Name</h1>
					<p th:text="${weather.get(0).address}">Region, Country</p>
				</div>

				<div class="hourly-dashboard">
					<div class="glass-card hourly-card" data-aos="fade-up" data-aos-duration="600" th:each="forecast : ${weather}">
						
						<div class="card-main-info">
							<div class="time-block">
								<span class="day-text" th:text="${forecast.day}"></span>
								<span class="time-text" th:text="${forecast.time}"></span>
							</div>
							
							<div class="temp-block">
								<img th:src="@{'/img/' + ${forecast.icon} + '.png'}" alt="Weather Icon" class="weather-icon" />
								<div class="temp-display">
									<h3 th:text="${forecast.temp}"></h3>
									<span class="degree">&deg;C</span>
								</div>
							</div>
							
							<div class="condition-block">
								<span th:text="${forecast.conditions}"></span>
							</div>
						</div>

						<div class="card-divider"></div>

						<div class="card-stats-grid">
							<div class="stat-item feels-like-highlight">
								<img th:src="@{/img/temperature.png}" alt="Feels Like" />
								<span>Feel like: </span>
								<strong th:text="${forecast.feelslike} + '&deg;C'"></strong>
							</div>
							
							<div class="stat-item">
								<img th:src="@{/img/wind.png}" alt="Wind Speed" />
								<span>Wind: </span>
								<strong><span th:text="${forecast.direction}"></span> <span th:text="${forecast.windspeed}"></span> km/h</strong>
							</div>

							<div class="stat-item">
								<img th:src="@{/img/cloud.png}" alt="Cloud Cover" />
								<span>Clouds: </span>
								<strong th:text="${forecast.cloudcover} + '%'"></strong>
							</div>

							<div class="stat-item">
								<img th:src="@{/img/wind1.png}" alt="Wind Gusts" />
								<span>Gusts: </span>
								<strong th:text="${forecast.windgust} + ' km/h'"></strong>
							</div>

							<div class="stat-item">
								<img th:src="@{/img/humidity2.png}" alt="Humidity" />
								<span>Humidity: </span>
								<strong th:text="${forecast.humidity} + '%'"></strong>
							</div>

							<div class="stat-item">
								<img th:src="@{/img/wind1.png}" alt="Precipitation" />
								<span>Precip: </span>
								<strong th:text="${forecast.precipprob} + '%'"></strong>
							</div>

							<div class="stat-item">
								<img th:src="@{/img/dew2.png}" alt="Dew Point" />
								<span>Dew: </span>
								<strong th:text="${forecast.dew} + '&deg;C'"></strong>
							</div>
						</div>
					</div>
				</div>
			</main>
		</div>
		
		<div class="spinner"></div>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
		<script th:src="@{/js/app.js}"></script>
	</body>
</html>
